<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Create Build - Aion 2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Create a Build</h1>
    <a class="btn" href="index.html">← Back</a>
  </header>

  <form id="buildForm" class="card form">
    <label>Title <input name="title" required /></label>
    <label>Class
      <select name="className" required>
        <option value="">Select class…</option>
        <option>Gladiator</option>
        <option>Templar</option>
        <option>Sorcerer</option>
        <option>Cleric</option>
        <option>Ranger</option>
        <option>Assassin</option>
        <option>Chanter</option>
        <option>Spiritmaster</option>
      </select>
    </label>
    <label>Author <input name="author" required /></label>
    <label>Description <textarea name="description" rows="4"></textarea></label>
    <label>Skills (comma separated) <input name="skills" placeholder="e.g. Flame Cage, Ice Chain, Aether Hold" /></label>
    <label>Gear Notes <textarea name="gear" rows="3"></textarea></label>
    <button class="btn" type="submit">Publish Build</button>
  </form>

  <script src="app.js"></script>
</body>
</html>
